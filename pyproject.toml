[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toy-poker"
version = "0.1.0"
description = "Research environment for toy poker games (Kuhn, Leduc)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "mypy>=1.8", "ruff>=0.3"]

[project.scripts]
play-kuhn = "toy_poker.examples.play_kuhn:main"
play-leduc = "toy_poker.examples.play_leduc:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toy_poker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["toy_poker"]
mypy_path = "src"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
